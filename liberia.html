<!DOCTYPE html>
<html>
<head>
    <title>Historical Floods in Liberia - Severity Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .map-title {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .legend {
            padding: 10px; font: 14px Arial, Helvetica, sans-serif;
            background: white; background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; line-height: 24px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="map-title"><b>Liberia Flood Severity (1985-Present)</b></div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([6.4281, -9.4295], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        function getColor(s) {
            return s == '2'   ? '#c0392b' : // High
                   s == '1.5' ? '#e67e22' : // Medium
                                '#f1c40f';   // Low
        }

        function getRadius(s) {
            return s == '2'   ? 15 : // High
                   s == '1.5' ? 10 : // Medium
                                7;   // Low
        }

        fetch('liberia_floods.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var props = feature.properties;
                        var popupContent = "<b>Liberia Flood Event</b><br>" +
                                         "⚠️ <b>Severity:</b> " + (props.Severity || "1") + "<br>" +
                                         "📅 <b>Began:</b> " + props.Began + "<br>" +
                                         "🌊 <b>Cause:</b> " + props.MainCause;
                        layer.bindPopup(popupContent);
                    },
                    pointToLayer: function (feature, latlng) {
                        var s = feature.properties.Severity;
                        return L.circleMarker(latlng, {
                            radius: getRadius(s),
                            fillColor: getColor(s),
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            });

        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = ["1", "1.5", "2"],
                labels = ["Low Risk", "Medium Risk", "High Risk"];

            div.innerHTML += "<b>Liberia Risk Levels</b><br>";
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
