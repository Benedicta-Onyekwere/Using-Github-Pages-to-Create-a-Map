        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg); color: var(--text-main); line-height: 1.6; }
        nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); padding: 1.25rem 0; border-bottom: 1px solid var(--border); }

        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 0.5rem; }
        #tableContainer { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: rgba(255,255,255,0.03); font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.75rem; }
        td { color: var(--text-muted); }
    </style>
</head>
