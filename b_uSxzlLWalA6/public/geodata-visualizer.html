<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoData Visualizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #1a1d2e;
      --card: #222639;
      --border: #2e3348;
      --text: #e8eaed;
      --muted: #9ca3af;
      --primary: #f0b429;
      --danger: #ef4444;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .logo svg { color: var(--primary); }
    
    .header-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .data-count {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
    
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.375rem;
      transition: all 0.2s;
    }
    
    .btn:hover { background: var(--border); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
    
    main {
      display: flex;
      height: calc(100vh - 65px);
    }
    
    .sidebar {
      width: 380px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .sidebar-section {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
    }
    
    .stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    .filters {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .filter-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    
    select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
    }
    
    select:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .data-table-container {
      flex: 1;
      overflow: auto;
      padding: 0.5rem;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    
    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    
    th {
      background: var(--bg);
      font-weight: 500;
      color: var(--muted);
      position: sticky;
      top: 0;
    }
    
    tr:hover { background: var(--bg); cursor: pointer; }
    tr.selected { background: rgba(240, 180, 41, 0.1); }
    
    .map-container {
      flex: 1;
      position: relative;
    }
    
    #map {
      width: 100%;
      height: 100%;
    }
    
    .dropzone {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 29, 46, 0.95);
      z-index: 1000;
      transition: all 0.3s;
    }
    
    .dropzone.hidden { display: none; }
    
    .dropzone.dragover {
      background: rgba(240, 180, 41, 0.1);
      border: 2px dashed var(--primary);
    }
    
    .dropzone-content {
      text-align: center;
      padding: 3rem;
      border: 2px dashed var(--border);
      border-radius: 1rem;
      max-width: 500px;
    }
    
    .dropzone.dragover .dropzone-content {
      border-color: var(--primary);
    }
    
    .dropzone svg {
      width: 4rem;
      height: 4rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    
    .dropzone h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .dropzone p {
      color: var(--muted);
      margin-bottom: 1rem;
    }
    
    .dropzone input {
      display: none;
    }
    
    .dropzone label {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: var(--bg);
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    
    .dropzone label:hover { opacity: 0.9; }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      max-width: 500px;
    }
    
    .mini-dropzone {
      padding: 0.75rem;
      border: 1px dashed var(--border);
      border-radius: 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mini-dropzone:hover {
      border-color: var(--primary);
      background: rgba(240, 180, 41, 0.05);
    }
    
    .mini-dropzone p {
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    .leaflet-popup-content-wrapper {
      background: var(--card);
      color: var(--text);
      border-radius: 0.5rem;
    }
    
    .leaflet-popup-tip { background: var(--card); }
    
    .popup-content h4 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
    
    .popup-content p {
      font-size: 0.875rem;
      color: var(--muted);
      margin: 0.25rem 0;
    }
    
    .popup-content strong { color: var(--text); }
    
    @media (max-width: 768px) {
      main { flex-direction: column; }
      .sidebar { width: 100%; height: 40%; }
      .map-container { height: 60%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      GeoData Visualizer
    </div>
    <div class="header-info" id="headerInfo"></div>
  </header>
  
  <main>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3>Quick Stats</h3>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Data Points</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Countries</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Total Dead</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Displaced</div></div>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>Filters</h3>
        <div class="filters">
          <div class="filter-group">
            <label>Country</label>
            <select id="countryFilter"><option value="all">All Countries</option></select>
          </div>
          <div class="filter-group">
            <label>Cause</label>
            <select id="causeFilter"><option value="all">All Causes</option></select>
          </div>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>Load New Data</h3>
        <div class="mini-dropzone" id="miniDropzone">
          <input type="file" id="miniFileInput" accept=".csv,.tsv,.txt">
          <p>Drop CSV here or click to browse</p>
        </div>
      </div>
      
      <div class="data-table-container">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </aside>
    
    <div class="map-container">
      <div id="map"></div>
      <div class="dropzone" id="dropzone">
        <div class="dropzone-content">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <h2>Drop Your Dataset</h2>
          <p>Drag and drop a CSV file with latitude/longitude columns, or click below to browse</p>
          <input type="file" id="fileInput" accept=".csv,.tsv,.txt">
          <label for="fileInput">Choose File</label>
          <div id="errorMsg"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // State
    let rawData = [];
    let filteredData = [];
    let markers = [];
    let map;
    let selectedRow = null;
    
    // Column name mappings for auto-detection
    const latColumns = ['lat', 'latitude', 'anonymous_lat', 'y', 'lat_dd', 'latitude_dd'];
    const lonColumns = ['lon', 'lng', 'long', 'longitude', 'anonymous_long', 'anonymous_lon', 'x', 'lon_dd', 'longitude_dd'];
    
    // Initialize map
    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([0, 20], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 19
      }).addTo(map);
    }
    
    // Parse CSV
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) throw new Error('File must have header and at least one data row');
      
      // Detect delimiter
      const firstLine = lines[0];
      const delimiter = firstLine.includes('\t') ? '\t' : ',';
      
      // Parse header
      const headers = firstLine.split(delimiter).map(h => h.trim().replace(/^["']|["']$/g, ''));
      
      // Find lat/lon columns
      const latCol = headers.findIndex(h => latColumns.includes(h.toLowerCase()));
      const lonCol = headers.findIndex(h => lonColumns.includes(h.toLowerCase()));
      
      if (latCol === -1 || lonCol === -1) {
        throw new Error('Could not find latitude/longitude columns. Expected columns like: lat, lon, latitude, longitude, anonymous_lat, anonymous_long');
      }
      
      // Parse rows
      const data = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        const values = [];
        let current = '';
        let inQuotes = false;
        
        for (const char of lines[i]) {
          if (char === '"' || char === "'") {
            inQuotes = !inQuotes;
          } else if (char === delimiter && !inQuotes) {
            values.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current.trim());
        
        const lat = parseFloat(values[latCol]);
        const lon = parseFloat(values[lonCol]);
        
        if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
          const row = { _lat: lat, _lon: lon, _index: i - 1 };
          headers.forEach((h, idx) => {
            row[h] = values[idx] || '';
          });
          data.push(row);
        }
      }
      
      if (data.length === 0) {
        throw new Error('No valid data points found with valid coordinates');
      }
      
      return { headers, data };
    }
    
    // Get severity color
    function getSeverityColor(severity) {
      const s = parseFloat(severity) || 1;
      if (s <= 1) return '#22c55e';
      if (s <= 1.5) return '#f0b429';
      if (s <= 2) return '#f97316';
      return '#ef4444';
    }
    
    // Get marker size based on impact
    function getMarkerSize(row) {
      const dead = parseFloat(row.Dead) || 0;
      const displaced = parseFloat(row.Displaced) || 0;
      const impact = dead + displaced / 100;
      return Math.min(Math.max(6, Math.log(impact + 1) * 3), 20);
    }
    
    // Update markers on map
    function updateMarkers() {
      // Clear existing markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      
      filteredData.forEach((row, idx) => {
        const color = getSeverityColor(row.Severity);
        const size = getMarkerSize(row);
        
        const marker = L.circleMarker([row._lat, row._lon], {
          radius: size,
          fillColor: color,
          color: '#fff',
          weight: 1,
          opacity: 0.8,
          fillOpacity: 0.7
        }).addTo(map);
        
        // Popup content
        let popupHtml = '<div class="popup-content">';
        popupHtml += `<h4>${row.Country || 'Unknown Location'}</h4>`;
        if (row.MainCause) popupHtml += `<p><strong>Cause:</strong> ${row.MainCause}</p>`;
        if (row.Dead) popupHtml += `<p><strong>Deaths:</strong> ${parseInt(row.Dead).toLocaleString()}</p>`;
        if (row.Displaced) popupHtml += `<p><strong>Displaced:</strong> ${parseInt(row.Displaced).toLocaleString()}</p>`;
        if (row.Severity) popupHtml += `<p><strong>Severity:</strong> ${row.Severity}</p>`;
        if (row.Began) popupHtml += `<p><strong>Date:</strong> ${row.Began}</p>`;
        if (row.Area) popupHtml += `<p><strong>Area:</strong> ${parseFloat(row.Area).toLocaleString()} km²</p>`;
        popupHtml += '</div>';
        
        marker.bindPopup(popupHtml);
        marker.on('click', () => selectRow(idx));
        markers.push(marker);
      });
      
      // Fit bounds if data exists
      if (filteredData.length > 0) {
        const bounds = L.latLngBounds(filteredData.map(d => [d._lat, d._lon]));
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }
    
    // Update stats
    function updateStats() {
      const countries = new Set(filteredData.map(d => d.Country).filter(Boolean));
      const totalDead = filteredData.reduce((sum, d) => sum + (parseInt(d.Dead) || 0), 0);
      const totalDisplaced = filteredData.reduce((sum, d) => sum + (parseInt(d.Displaced) || 0), 0);
      
      const statsHtml = `
        <div class="stat-card"><div class="stat-value">${filteredData.length.toLocaleString()}</div><div class="stat-label">Data Points</div></div>
        <div class="stat-card"><div class="stat-value">${countries.size}</div><div class="stat-label">Countries</div></div>
        <div class="stat-card"><div class="stat-value">${totalDead.toLocaleString()}</div><div class="stat-label">Total Dead</div></div>
        <div class="stat-card"><div class="stat-value">${totalDisplaced.toLocaleString()}</div><div class="stat-label">Displaced</div></div>
      `;
      document.getElementById('statsGrid').innerHTML = statsHtml;
    }
    
    // Update filters
    function updateFilters() {
      const countries = [...new Set(rawData.map(d => d.Country).filter(Boolean))].sort();
      const causes = [...new Set(rawData.map(d => d.categorised_cause || d.MainCause).filter(Boolean))].sort();
      
      const countrySelect = document.getElementById('countryFilter');
      countrySelect.innerHTML = '<option value="all">All Countries</option>' + 
        countries.map(c => `<option value="${c}">${c}</option>`).join('');
      
      const causeSelect = document.getElementById('causeFilter');
      causeSelect.innerHTML = '<option value="all">All Causes</option>' +
        causes.map(c => `<option value="${c}">${c}</option>`).join('');
    }
    
    // Apply filters
    function applyFilters() {
      const country = document.getElementById('countryFilter').value;
      const cause = document.getElementById('causeFilter').value;
      
      filteredData = rawData.filter(d => {
        if (country !== 'all' && d.Country !== country) return false;
        if (cause !== 'all' && d.categorised_cause !== cause && d.MainCause !== cause) return false;
        return true;
      });
      
      updateMarkers();
      updateStats();
      updateTable();
      updateHeaderInfo();
    }
    
    // Update table
    function updateTable() {
      const displayCols = ['Country', 'MainCause', 'Dead', 'Displaced', 'Severity'];
      
      document.getElementById('tableHead').innerHTML = 
        '<tr>' + displayCols.map(c => `<th>${c}</th>`).join('') + '</tr>';
      
      document.getElementById('tableBody').innerHTML = filteredData.map((row, idx) => 
        `<tr data-idx="${idx}" class="${selectedRow === idx ? 'selected' : ''}">` +
        displayCols.map(c => `<td>${row[c] || '-'}</td>`).join('') +
        '</tr>'
      ).join('');
    }
    
    // Select row
    function selectRow(idx) {
      selectedRow = idx;
      updateTable();
      
      if (filteredData[idx]) {
        map.setView([filteredData[idx]._lat, filteredData[idx]._lon], 8);
        markers[idx]?.openPopup();
      }
    }
    
    // Update header info
    function updateHeaderInfo() {
      if (rawData.length === 0) {
        document.getElementById('headerInfo').innerHTML = '';
        return;
      }
      
      document.getElementById('headerInfo').innerHTML = `
        <div class="data-count">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          ${filteredData.length} of ${rawData.length} points
        </div>
        <button class="btn btn-danger" onclick="clearData()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          Clear Data
        </button>
      `;
    }
    
    // Clear data
    function clearData() {
      rawData = [];
      filteredData = [];
      selectedRow = null;
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      
      document.getElementById('dropzone').classList.remove('hidden');
      document.getElementById('countryFilter').value = 'all';
      document.getElementById('causeFilter').value = 'all';
      updateStats();
      updateTable();
      updateHeaderInfo();
    }
    
    // Load file
    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const result = parseCSV(e.target.result);
          rawData = result.data;
          filteredData = [...rawData];
          
          document.getElementById('dropzone').classList.add('hidden');
          document.getElementById('errorMsg').innerHTML = '';
          
          updateFilters();
          updateMarkers();
          updateStats();
          updateTable();
          updateHeaderInfo();
        } catch (err) {
          document.getElementById('errorMsg').innerHTML = 
            `<div class="error">${err.message}</div>`;
        }
      };
      reader.readAsText(file);
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      const miniDropzone = document.getElementById('miniDropzone');
      const miniFileInput = document.getElementById('miniFileInput');
      
      // Main dropzone
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
      
      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
      });
      
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
      });
      
      fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
      });
      
      // Mini dropzone
      miniDropzone.addEventListener('click', () => miniFileInput.click());
      miniDropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        miniDropzone.style.borderColor = 'var(--primary)';
      });
      miniDropzone.addEventListener('dragleave', () => {
        miniDropzone.style.borderColor = 'var(--border)';
      });
      miniDropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        miniDropzone.style.borderColor = 'var(--border)';
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
      });
      miniFileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
      });
      
      // Filters
      document.getElementById('countryFilter').addEventListener('change', applyFilters);
      document.getElementById('causeFilter').addEventListener('change', applyFilters);
      
      // Table row clicks
      document.getElementById('tableBody').addEventListener('click', (e) => {
        const row = e.target.closest('tr');
        if (row) selectRow(parseInt(row.dataset.idx));
      });
    });
  </script>
</body>
</html>
