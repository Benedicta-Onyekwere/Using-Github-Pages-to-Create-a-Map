<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloodArchive+ Pro Visualizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #020617;
      --sidebar: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #818cf8;
      --danger: #ef4444;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    header { background: var(--sidebar); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; height: 70px; }
    .logo { font-weight: 800; font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .home-btn { text-decoration: none; color: var(--text); font-weight: 600; font-size: 0.9rem; background: var(--card); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); transition: all 0.2s; }
    main { display: flex; height: calc(100vh - 70px); }
    .sidebar { width: 420px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-content { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .filter-section { margin-bottom: 2rem; }
    select { width: 100%; padding: 0.8rem; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); margin-bottom: 1rem; outline: none; }
    .table-container { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; padding: 12px; background: var(--card); position: sticky; top: 0; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: rgba(129, 140, 248, 0.1); cursor: pointer; }
    #map { flex: 1; height: 100%; }
    #loading { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .debug-msg { color: var(--muted); font-size: 0.7rem; margin-top: 15px; font-family: monospace; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 20px;">Initializing Pro Engine...</p>
    <div id="debug" class="debug-msg">Checking for data file...</div>
  </div>

  <header>
    <div class="logo">FLOOD ARCHIVE PRO</div>
    <a href="index.html" class="home-btn">← Return to Hub</a>
  </header>

  <main>
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val" id="stat-points">0</div><div class="stat-label">Events</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-countries">0</div><div class="stat-label">Countries</div></div>
        </div>
        <div class="filter-section">
          <select id="country-filter"><option value="all">All Countries</option></select>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>Year</th><th>Country</th><th>Severity</th></tr></thead>
            <tbody id="data-table"></tbody>
          </table>
        </div>
      </div>
    </aside>
    <div id="map"></div>
  </main>

  <script>
    let rawData = [];
    let map, markers = [];

    function log(msg) {
        console.log(msg);
        document.getElementById('debug').innerText = msg;
    }

    function init() {
      map = L.map('map', { zoomControl: false }).setView([15, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);
      
      log("Fetching floodarchive_cleaned.csv...");
      Papa.parse('floodarchive_cleaned.csv', {
        download: true,
        header: true,
        complete: function(results) {
          log("Data loaded. " + results.data.length + " rows found.");
          processData(results.data);
        },
        error: function(err) {
          log("Error: " + err);
        }
      });
    }

    function processData(data) {
      log("Parsing coordinates...");
      rawData = data.map(d => {
        // Looking for YOUR specific headers: 'lat' and 'long'
        const lat = parseFloat(d.lat);
        const lon = parseFloat(d.long);
        return { ...d, _lat: lat, _lon: lon };
      }).filter(d => !isNaN(d._lat) && !isNaN(d._lon));

      log("Success: " + rawData.length + " valid points.");
      
      const cf = document.getElementById('country-filter');
      const countries = [...new Set(rawData.map(d => d.Country))].sort();
      countries.forEach(c => cf.add(new Option(c, c)));

      updateUI();
      document.getElementById('loading').style.display = 'none';
    }

    function updateUI() {
      const countryVal = document.getElementById('country-filter').value;
      const filtered = rawData.filter(d => countryVal === 'all' || d.Country === countryVal);

      document.getElementById('stat-points').innerText = filtered.length;
      document.getElementById('stat-countries').innerText = [...new Set(filtered.map(d => d.Country))].length;

      document.getElementById('data-table').innerHTML = filtered.slice(0, 50).map((d, i) => `
        <tr onclick="focusPoint(${rawData.indexOf(d)})">
          <td>${d.Year}</td>
          <td>${d.Country}</td>
          <td>${d.Severity}</td>
        </tr>
      `).join('');

      markers.forEach(m => map.removeLayer(m));
      markers = filtered.map(d => {
        const m = L.circleMarker([d._lat, d._lon], {
          radius: 6, fillColor: '#818cf8', color: '#fff', weight: 1, fillOpacity: 0.7
        }).addTo(map);
        m.bindPopup(`<b>${d.Country}</b><br>${d.Year}`);
        return m;
      });

      if (markers.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds(), { padding: [40, 40] });
      }
    }

    function focusPoint(idx) {
      const d = rawData[idx];
      map.flyTo([d._lat, d._lon], 8);
    }

    document.getElementById('country-filter').addEventListener('change', updateUI);
    init();
  </script>
</body>
</html>
