<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Impact: GBV Indicators - Grand Cape Mount</title>
    
    <!-- Leaflet & Plus Jakarta Sans -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030712;
            --sidebar: #111827;
            --card: #1f2937;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #f43f5e; /* Social Impact Rose */
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1rem; color: var(--accent); letter-spacing: 1px; }
        .home-btn {
            background: var(--card);
            color: var(--text-primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .home-btn:hover { border-color: var(--accent); }

        main { flex: 1; display: flex; position: relative; }

        /* Sidebar for Stats */
        .sidebar {
            width: 350px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 2rem;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.2; }
        .sidebar p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 2rem; }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); font-weight: 700; margin-bottom: 4px; display: block; }
        .stat-value { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .stat-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 800; background: rgba(244, 63, 94, 0.1); color: var(--accent); border: 1px solid rgba(244, 63, 94, 0.2); margin-top: 8px; }

        #map { flex: 1; z-index: 1; background: #030712; }

        /* Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--sidebar);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 5px;
            border: 1px solid var(--border);
        }
        .leaflet-popup-tip { background: var(--sidebar); }
        .popup-title { font-size: 1rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .popup-row { font-size: 0.85rem; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .popup-row b { color: var(--text-secondary); }

        /* Custom Zoom Control */
        .leaflet-bar { border: 1px solid var(--border) !important; border-radius: 8px !important; overflow: hidden; }
        .leaflet-bar a { background: var(--card) !important; color: white !important; border: none !important; }
        .leaflet-bar a:hover { background: var(--accent) !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SOCIAL IMPACT MODULE</div>
        <a href="index.html" class="home-btn">← Return to Hub</a>
    </header>

    <main>
        <aside class="sidebar">
            <h1>Grand Cape Mount</h1>
            <p>Analyzing sub-national social indicators and protective systems in Liberia's Spotlight County.</p>

            <div class="stat-card">
                <span class="stat-label">FGM Prevalence</span>
                <div class="stat-value">71%</div>
                <div class="stat-badge">High Impact Area</div>
            </div>

            <div class="stat-card">
                <span class="stat-label">Response Status</span>
                <div class="stat-value">Spotlight</div>
                <div class="stat-badge" style="background:rgba(16, 185, 129, 0.1); color:#10b981; border-color:rgba(16, 185, 129, 0.2)">Active Program</div>
            </div>

            <div class="stat-card">
                <span class="stat-label">Protective Infrastructure</span>
                <div class="stat-value" id="site-count">...</div>
                <p style="font-size: 0.75rem; margin: 8px 0 0; color: var(--text-secondary)">One-Stop Centers & Safe Homes mapped.</p>
            </div>
        </aside>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([7.05, -11.0], 9);

        // Dark Mode Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        fetch('gbv_grand_cape_mount.geojson')
            .then(res => res.json())
            .then(data => {
                const geoJsonLayer = L.geoJSON(data, {
                    style: {
                        color: '#f43f5e',
                        weight: 3,
                        fillColor: '#f43f5e',
                        fillOpacity: 0.1,
                        dashArray: '5, 10'
                    },
                    onEachFeature: function(feature, layer) {
                        const p = feature.properties;
                        
                        // Update site count in sidebar
                        const totalSites = (p.one_stop_centers?.length || 0) + (p.safe_homes?.length || 0);
                        document.getElementById('site-count').innerText = totalSites + " Sites";

                        let popupHtml = `
                            <div class="popup-title">${p.shapeName} County</div>
                            <div class="popup-row"><b>FGM Prevalence:</b> <span>${p.fgm_prevalence}</span></div>
                            <div class="popup-row"><b>Spotlight County:</b> <span>${p.spotlight_county}</span></div>
                            <div class="popup-row"><b>Women Legislators:</b> <span>${p.women_legislators}</span></div>
                            <div style="margin-top:10px; font-size:0.75rem; border-top:1px solid var(--border); padding-top:10px">
                                <b style="color:var(--accent)">RESPONSE CENTERS:</b><br>
                                ${p.one_stop_centers?.join('<br>') || 'None'}
                            </div>
                        `;
                        layer.bindPopup(popupHtml);

                        // Highlight on hover
                        layer.on('mouseover', function() {
                            this.setStyle({ fillOpacity: 0.2, weight: 4 });
                        });
                        layer.on('mouseout', function() {
                            this.setStyle({ fillOpacity: 0.1, weight: 3 });
                        });
                    }
                }).addTo(map);

                // Auto-zoom to fit the county
                map.fitBounds(geoJsonLayer.getBounds(), { padding: [50, 50] });
            })
            .catch(err => {
                console.error("Error loading GBV data:", err);
            });
    </script>
</body>
</html>
