<!DOCTYPE html>
<html>
<head>
    <title>Liberia Health Infrastructure & Flood Risk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet & Clustering CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; }
        #map { height: 100vh; width: 100%; }
        
        /* Professional Legend Styling */
        .legend {
            padding: 12px;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-radius: 8px;
            line-height: 1.6;
            color: #333;
            max-width: 200px;
        }
        .legend h4 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .legend i { width: 14px; height: 14px; float: left; margin-right: 10px; margin-top: 4px; opacity: 0.9; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
        .legend .at-risk { border: 2px solid #fff; box-shadow: 0 0 0 2px #e74c3c; background: #e74c3c; }
        
        /* Popup Styling */
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.4); }
        .at-risk-popup b { color: #e74c3c; font-size: 14px; }
    </style>
</head>
<body>
    <a href="index.html" style="position: absolute; top: 15px; left: 15px; z-index: 1000; background: white; padding: 8px 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-decoration: none; color: #2c3e50; font-weight: bold; font-size: 14px;">← Home</a>
    <div id="map"></div>

    <!-- Leaflet & Clustering JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        // Initialize Map with a clean "CartoDB Positron" tile set
        var map = L.map('map').setView([6.489, -10.797], 7);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Define Color Palettes
        var colors = {
            atRisk: '#e74c3c', // Vibrant Red
            healthSite: '#5d6d7e', // Muted Blue-Grey
            floodHigh: '#154360', // Deep Blue
            floodMed: '#2980b9', // Medium Blue
            floodLow: '#aed6f1'  // Light Blue
        };

        // 1. Load AT-RISK Health Facilities (Highlighted Red Markers)
        var atRiskLayer = L.layerGroup().addTo(map);
        fetch('at_risk_health_facilities.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup("<div class='at-risk-popup'><b>⚠️ AT RISK: " + (feature.properties.name || "Unnamed Facility") + "</b><br>" +
                                         "<b>Type:</b> " + feature.properties.amenity + "<br>" +
                                         "<b>Operator:</b> " + (feature.properties.operator || "Unknown") + "</div>");
                    },
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 10,
                            fillColor: colors.atRisk,
                            color: "#fff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                    }
                }).addTo(atRiskLayer);
            });

        // 2. Load General Health Facilities (Using Clustering to keep it clean)
        var healthCluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            showCoverageOnHover: false
        });
        
        fetch('liberia_health_facilities.geojson')
            .then(res => res.json())
            .then(data => {
                var geoJsonLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 4,
                            fillColor: colors.healthSite,
                            color: "#2c3e50",
                            weight: 1,
                            fillOpacity: 0.6
                        });
                    }
                });
                healthCluster.addLayer(geoJsonLayer);
                map.addLayer(healthCluster);
            });

        // 3. Load Flood Events (Blue scale for water)
        function getFloodColor(s) {
            return s == '2'   ? colors.floodHigh : 
                   s == '1.5' ? colors.floodMed : 
                                colors.floodLow;
        }

        var floodLayer = L.layerGroup().addTo(map);
        fetch('floods.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup("<b>Historical Flood</b><br>Severity: " + (feature.properties.severity || "1"));
                    },
                    pointToLayer: function (feature, latlng) {
                        var s = feature.properties.severity;
                        return L.circleMarker(latlng, {
                            radius: s == '2' ? 12 : s == '1.5' ? 8 : 5,
                            fillColor: getFloodColor(s),
                            color: "#fff",
                            weight: 1,
                            fillOpacity: 0.7
                        });
                    }
                }).addTo(floodLayer);
            });

        // Add Layer Control
        var overlayMaps = {
            "<span style='color: #e74c3c; font-weight: bold;'>⚠️ At-Risk Sites</span>": atRiskLayer,
            "Health Facilities": healthCluster,
            "Flood History": floodLayer
        };
        L.control.layers(null, overlayMaps, {collapsed: false}).addTo(map);

        // Legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Map Key</h4>';
            div.innerHTML += '<i style="background:' + colors.atRisk + '; border: 2px solid #fff; outline: 2px solid #e74c3c;"></i> <b>At-Risk Site</b><br>';
            div.innerHTML += '<i style="background:' + colors.healthSite + '"></i> Health Facility<br>';
            div.innerHTML += '<br><h4>Flood Severity</h4>';
            div.innerHTML += '<i style="background:' + colors.floodHigh + '"></i> Major Event<br>';
            div.innerHTML += '<i style="background:' + colors.floodMed + '"></i> Moderate Event<br>';
            div.innerHTML += '<i style="background:' + colors.floodLow + '"></i> Minor Event<br>';
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
