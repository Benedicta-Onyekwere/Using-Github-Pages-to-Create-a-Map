<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Tools - Liberia Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; color: #334155; }
        nav { background: #1e293b; padding: 1.25rem 0; border-bottom: 1px solid #e2e8f0; }
        nav .container { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; }
        .home-link { font-weight: bold; margin-left: 0 !important; color: #6366f1 !important; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .upload-box { background: white; padding: 2.5rem; border-radius: 12px; border: 2px dashed #cbd5e1; text-align: center; margin-bottom: 2rem; transition: border-color 0.3s; }
        .upload-box:hover { border-color: #6366f1; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 1rem; font-size: 0.9rem; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; font-weight: 600; color: #475569; }
        .btn { background: #6366f1; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <nav>
        <div class="container">
            <a href="index.html" class="home-link">← Return Home</a>
            <div>
                <a href="liberia.html">Health Map</a>
                <a href="gbv_map.html">GBV Map</a>
                <a href="dashboard.html">Charts</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>CSV Data Inspector</h1>
        <p>Upload a cleaned CSV file to view its contents before mapping.</p>
        
        <div class="upload-box">
            <input type="file" id="csvFile" accept=".csv" style="display:none">
            <button class="btn" onclick="document.getElementById('csvFile').click()">Choose CSV File</button>
            <p id="fileName" style="margin-top:15px; color:#64748b;">No file chosen</p>
        </div>

        <div id="tableContainer" style="overflow-x:auto">
            <!-- Table will appear here -->
        </div>
    </div>

    <script>
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('fileName').textContent = file.name;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    renderTable(results.data);
                }
            });
        });

        function renderTable(data) {
            if (data.length === 0) return;
            
            let html = '<table><thead><tr>';
            const headers = Object.keys(data[0]);
            
            headers.forEach(h => {
                html += `<th>${h}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            data.slice(0, 50).forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    html += `<td>${row[h] || ''}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            if (data.length > 50) html += `<p style="color:#64748b; margin-top:10px;">Showing first 50 of ${data.length} rows.</p>`;
            
            document.getElementById('tableContainer').innerHTML = html;
        }
    </script>
</body>
</html>
