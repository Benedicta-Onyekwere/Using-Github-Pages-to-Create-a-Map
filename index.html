<!DOCTYPE html>
<html>
<head>
    <title>Global Historical Floods - Severity Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .legend {
            padding: 10px; font: 14px Arial, Helvetica, sans-serif;
            background: white; background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; line-height: 24px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Zoom to Liberia initially
        map.setView([6.489, -10.797], 7);

        // Load General Health Facilities (Small Grey Dots)
        fetch('liberia_health_facilities.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 3,
                            fillColor: "#95a5a6",
                            color: "#000",
                            weight: 0.5,
                            fillOpacity: 0.5
                        });
                    }
                }).addTo(map);
            });

        // Load AT-RISK Health Facilities (Bright Red Icons)
        fetch('at_risk_health_facilities.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup("<b>AT RISK: " + (feature.properties.name || "Unknown") + "</b><br>" +
                                         "Type: " + feature.properties.amenity);
                    },
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 8,
                            fillColor: "#e74c3c",
                            color: "#fff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 1
                        });
                    }
                }).addTo(map);
            });

        // Function to choose color based on severity
        function getColor(s) {
            return s == '2'   ? '#7b241c' : // Deep Maroon
                   s == '1.5' ? '#d35400' : // Burnt Orange
                                '#f1c40f';   // Vibrant Yellow
        }

        // Function to choose size based on severity
        function getRadius(s) {
            return s == '2'   ? 10 : // Larger
                   s == '1.5' ? 6 :
                                4;
        }

        fetch('floods.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var popupContent = "<b>Country:</b> " + feature.properties.country + "<br>" +
                                         "<b>Severity:</b> " + (feature.properties.severity || "1") + "<br>" +
                                         "<b>Cause:</b> " + feature.properties.cause;
                        layer.bindPopup(popupContent);
                    },
                    pointToLayer: function (feature, latlng) {
                        var s = feature.properties.severity;
                        return L.circleMarker(latlng, {
                            radius: getRadius(s),
                            fillColor: getColor(s),
                            color: "#000", // Black border
                            weight: 1.5,   // Thicker border
                            opacity: 1,
                            fillOpacity: 0.9 // More solid
                        });
                    }
                }).addTo(map);
            });

        // Add a Legend to the map
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = ["1", "1.5", "2"],
                labels = ["Low Severity", "Medium Severity", "High Severity"];

            div.innerHTML += "<b>Map Features</b><br>";
            div.innerHTML += '<i style="background:#e74c3c; border: 1px solid white"></i> At-Risk Facility<br>';
            div.innerHTML += '<i style="background:#95a5a6; border: 1px solid black"></i> Other Health Site<br>';
            div.innerHTML += "<br><b>Flood Severity</b><br>";
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
