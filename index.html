<!DOCTYPE html>
<html>
<head>
    <title>Global Historical Floods - Severity Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .legend {
            padding: 10px; font: 14px Arial, Helvetica, sans-serif;
            background: white; background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; line-height: 24px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Function to choose color based on severity
        function getColor(s) {
            return s == '2'   ? '#c0392b' :
                   s == '1.5' ? '#e67e22' :
                                '#f1c40f';
        }

        // Function to choose size based on severity
        function getRadius(s) {
            return s == '2'   ? 8 :
                   s == '1.5' ? 5 :
                                3;
        }

        fetch('floods.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var popupContent = "<b>Country:</b> " + feature.properties.country + "<br>" +
                                         "<b>Severity:</b> " + (feature.properties.severity || "1") + "<br>" +
                                         "<b>Cause:</b> " + feature.properties.cause;
                        layer.bindPopup(popupContent);
                    },
                    pointToLayer: function (feature, latlng) {
                        var s = feature.properties.severity;
                        return L.circleMarker(latlng, {
                            radius: getRadius(s),
                            fillColor: getColor(s),
                            color: "#000",
                            weight: 0.5,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            });

        // Add a Legend to the map
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = ["1", "1.5", "2"],
                labels = ["Low Severity", "Medium Severity", "High Severity"];

            div.innerHTML += "<b>Flood Severity</b><br>";
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
