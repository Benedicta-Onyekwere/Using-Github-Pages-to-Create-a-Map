<!DOCTYPE html>
<html>
<head>
    <title>Historical Floods Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map and set its view to a global zoom level
        var map = L.map('map').setView([20, 0], 2);

        // Add an OpenStreetMap tile layer (the background map)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Load the GeoJSON data
        fetch('floods.geojson')
            .then(response => response.json())
            .then(data => {
                // Add the GeoJSON layer to the map
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        // Add a popup for each flood event
                        var popupContent = "<b>Country:</b> " + feature.properties.country + "<br>" +
                                         "<b>Date:</b> " + feature.properties.began + "<br>" +
                                         "<b>Cause:</b> " + feature.properties.cause + "<br>" +
                                         "<b>Deaths:</b> " + (feature.properties.dead || "Unknown");
                        layer.bindPopup(popupContent);
                    },
                    pointToLayer: function (feature, latlng) {
                        // Change markers into circles for better performance
                        return L.circleMarker(latlng, {
                            radius: 5,
                            fillColor: "#0078ff",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Error loading the GeoJSON file:', error));
    </script>
</body>
</html>
